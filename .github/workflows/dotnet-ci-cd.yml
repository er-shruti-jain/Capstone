
name: .NET CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 3: Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore Capstone.sln

      # Step 4: Build the solution
      - name: Build solution
        run: dotnet build Capstone.sln --configuration Release --no-restore

      # Step 5: Run xUnit test cases
      - name: Run unit tests
        run: dotnet test Capstone.sln --configuration Release --no-build
